server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Kopfzeilen auf Server-Ebene setzen (nicht in einem
    # location-Block - dort würde ein weiteres add_header alle geerbten
    # Kopfzeilen verwerfen, siehe PROJECT_BRIEF.md Abschnitt 8 / otherApp).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Startpunkt für eine CSP - vor dem Erzwingen erst als
    # Content-Security-Policy-Report-Only in Chrome/Edge testen (Firefox
    # protokolliert Report-Only ohne report-uri nicht, siehe Lessons Learned).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://wehen-api.familieaschenbrenner.de; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets mit Cache-Busting-Hash im Dateinamen: lang cachen. Nur `expires`
    # verwenden, kein zusätzliches add_header (siehe oben).
    location /assets/ {
        expires 30d;
    }

    # Service Worker & Manifest nie cachen: Updates müssen sofort ankommen,
    # es ist eine kurzlebige App über wenige Tage.
    location = /sw.js {
        expires -1;
    }
    location = /manifest.webmanifest {
        expires -1;
    }
}
